[project]
name = "chrometrans"
version = "0.1.0"
description = "Chrome 网课实时字幕：按进程捕获音频 + 本地 ASR + 翻译，字幕落盘"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "process-audio-capture==1.0.0",
    "pyaudiowpatch>=0.2.12.8",
    "soxr",
    "numpy",
    "httpx>=0.28.1",
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.8.2",
    "nvidia-cublas-cu12>=12.9.2.10",
    "silero-vad>=6.2.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
    "pyside6",
]

[project.scripts]
chrometrans = "chrometrans.cli:main"
chrometrans-gui = "chrometrans.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chrometrans"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not gui'"
markers = [
    "integration: 需要真实音频设备与 Chrome 在播放",
    "gui: 需要 Qt 事件循环（用 offscreen 平台跑）",
]
